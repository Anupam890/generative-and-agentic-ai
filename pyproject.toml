    "langchainhub>=0.1.21",
    "langgraph>=0.4.0",
    "lxml>=6.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "streamlit>=1.56.0",
    "tavily-python>=0.7.23",
    "fpdf2>=2.8.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "markdown>=3.5.0",
]
